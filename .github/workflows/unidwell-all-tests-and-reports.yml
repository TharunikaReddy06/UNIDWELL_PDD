name: 🧪 Unidwell Test Automation — All 4 Test Suites & Excel Report Artifacts

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # ============================================================================
  # TEST SUITE 1: Selenium Web Frontend E2E Automated Tests
  # ============================================================================
  selenium-web-tests:
    name: 🌐 Test Suite 1 — Selenium Web UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Selenium Tests & Generate Excel Report
        run: node tests/selenium-tests/run-tests.js

      - name: 📤 Upload Selenium Test Excel Reports to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Web_Test_Excel_Reports
          path: |
            tests/selenium-tests/reports/*.xlsx
            **/selenium-tests/*.xlsx
          if-no-files-found: warn
          retention-days: 90

  # ============================================================================
  # TEST SUITE 2: Appium Mobile App E2E Automated Tests
  # ============================================================================
  appium-mobile-tests:
    name: 📱 Test Suite 2 — Appium Mobile App Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Appium Tests & Generate Excel Report
        run: node tests/appium-tests/run-tests.js

      - name: 📤 Upload Appium Mobile Test Excel Reports to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Appium_Mobile_Test_Excel_Reports
          path: |
            tests/appium-tests/reports/*.xlsx
            **/appium-tests/*.xlsx
          if-no-files-found: warn
          retention-days: 90

  # ============================================================================
  # TEST SUITE 3: Baseline / 100-User Load & Performance Tests
  # ============================================================================
  baseline-load-tests:
    name: ⚡ Test Suite 3 — Baseline & 100-User Load Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Load Test & Generate Excel Report
        run: node tests/load-tests/run-tests.js

      - name: 📤 Upload Baseline Load Test Excel Reports to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Baseline_Load_Test_Excel_Reports
          path: |
            tests/load-tests/reports/*.xlsx
            **/load-tests/*.xlsx
          if-no-files-found: warn
          retention-days: 90

  # ============================================================================
  # TEST SUITE 4: Vulnerability & Security Assessment Tests
  # ============================================================================
  vulnerability-security-tests:
    name: 🔒 Test Suite 4 — Vulnerability & Security Assessment Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Security Scan & Generate Vulnerability Reports
        run: node tests/vulnerability-tests/run-tests.js

      - name: 📤 Upload Vulnerability Test Excel Reports to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability_Security_Test_Excel_Reports
          path: |
            tests/vulnerability-tests/reports/*.xlsx
            **/vulnerability-tests/*.xlsx
          if-no-files-found: warn
          retention-days: 90

  # ============================================================================
  # COMBINED JOB: Consolidate All 4 Test Excel Reports into 1 Master Artifact
  # ============================================================================
  bundle-all-test-reports:
    name: 📦 Consolidated Master Artifact — All 4 Excel Reports
    runs-on: ubuntu-latest
    needs: [selenium-web-tests, appium-mobile-tests, baseline-load-tests, vulnerability-security-tests]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts from Previous Jobs
        uses: actions/download-artifact@v4
        with:
          path: all-downloaded-artifacts
        continue-on-error: true

      - name: Aggregate & Organize All Excel Reports
        run: |
          mkdir -p UNIDWELL_ALL_TEST_EXCEL_REPORTS
          find . -name "*.xlsx" -not -path "*/node_modules/*" -exec cp {} UNIDWELL_ALL_TEST_EXCEL_REPORTS/ \;
          echo "## 📊 All 4 Test Suite Excel Reports Ready for Download:"
          ls -lh UNIDWELL_ALL_TEST_EXCEL_REPORTS/

      - name: 📤 Upload Consolidated Master Artifact (All 4 Excel Reports)
        uses: actions/upload-artifact@v4
        with:
          name: UNIDWELL_ALL_4_TEST_SUITES_EXCEL_REPORTS_MASTER_BUNDLE
          path: UNIDWELL_ALL_TEST_EXCEL_REPORTS/*.xlsx
          if-no-files-found: error
          retention-days: 90
