name: 🔒 Security Review — SAST, Dependency Scan & Report Generation

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:
    inputs:
      run_dast:
        description: 'Run DAST against live environment'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      environment_url:
        description: 'Live environment URL for DAST (optional)'
        required: false
        default: ''

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================
  # JOB 1: Detect Technology Stack
  # ============================================================
  detect-stack:
    name: 🔍 Detect Backend Technology Stack
    runs-on: ubuntu-latest
    outputs:
      is_node: ${{ steps.detect.outputs.is_node }}
      is_python: ${{ steps.detect.outputs.is_python }}
      is_java: ${{ steps.detect.outputs.is_java }}
      is_go: ${{ steps.detect.outputs.is_go }}
      is_php: ${{ steps.detect.outputs.is_php }}
      framework: ${{ steps.detect.outputs.framework }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Technology Stack
        id: detect
        run: |
          echo "is_node=false" >> $GITHUB_OUTPUT
          echo "is_python=false" >> $GITHUB_OUTPUT
          echo "is_java=false" >> $GITHUB_OUTPUT
          echo "is_go=false" >> $GITHUB_OUTPUT
          echo "is_php=false" >> $GITHUB_OUTPUT
          echo "framework=unknown" >> $GITHUB_OUTPUT

          if [ -f "package.json" ]; then
            echo "is_node=true" >> $GITHUB_OUTPUT
            if grep -q '"vite"' package.json; then
              echo "framework=vite-react-spa" >> $GITHUB_OUTPUT
            elif grep -q '"express"' package.json; then
              echo "framework=express" >> $GITHUB_OUTPUT
            elif grep -q '"nestjs/core"' package.json; then
              echo "framework=nestjs" >> $GITHUB_OUTPUT
            elif grep -q '"next"' package.json; then
              echo "framework=nextjs" >> $GITHUB_OUTPUT
            else
              echo "framework=node-generic" >> $GITHUB_OUTPUT
            fi
          fi

          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "is_python=true" >> $GITHUB_OUTPUT
            if grep -q "django" requirements.txt 2>/dev/null; then
              echo "framework=django" >> $GITHUB_OUTPUT
            elif grep -q "fastapi" requirements.txt 2>/dev/null; then
              echo "framework=fastapi" >> $GITHUB_OUTPUT
            fi
          fi

          if [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            echo "is_java=true" >> $GITHUB_OUTPUT
            echo "framework=spring-boot" >> $GITHUB_OUTPUT
          fi

          if [ -f "go.mod" ]; then
            echo "is_go=true" >> $GITHUB_OUTPUT
            echo "framework=go" >> $GITHUB_OUTPUT
          fi

          if [ -f "composer.json" ]; then
            echo "is_php=true" >> $GITHUB_OUTPUT
            echo "framework=laravel" >> $GITHUB_OUTPUT
          fi

      - name: Report Stack Detection
        run: |
          echo "## 🔍 Technology Stack Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Detected Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Project | ${{ steps.detect.outputs.is_node }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | ${{ steps.detect.outputs.framework }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Project | ${{ steps.detect.outputs.is_python }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java Project | ${{ steps.detect.outputs.is_java }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: SAST — Semgrep Static Analysis
  # ============================================================
  sast-semgrep:
    name: 🔬 SAST — Semgrep Static Analysis
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/react
            p/nodejs
            p/secrets
            p/xss
            p/injection
            p/jwt
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep (fallback — no token)
        if: env.SEMGREP_APP_TOKEN == ''
        run: |
          pip install semgrep
          semgrep --config=auto \
            --json \
            --output=semgrep-results.json \
            --severity=ERROR \
            --severity=WARNING \
            . || true
          echo "Semgrep scan complete"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-results
          path: semgrep-results.json
          if-no-files-found: ignore

  # ============================================================
  # JOB 3: Secret Scanning — Gitleaks
  # ============================================================
  secret-scan:
    name: 🔑 Secret Scanning — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Manual Gitleaks Scan (with JSON output)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --no-git \
            --verbose || true
          echo "Gitleaks scan complete"

      - name: Parse Gitleaks Results
        run: |
          if [ -f gitleaks-report.json ]; then
            SECRET_COUNT=$(cat gitleaks-report.json | python3 -c "import json,sys; data=json.load(sys.stdin); print(len(data) if isinstance(data, list) else 0)" 2>/dev/null || echo "0")
            echo "## 🔑 Secret Scanning Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Secrets Found | $SECRET_COUNT |" >> $GITHUB_STEP_SUMMARY
            if [ "$SECRET_COUNT" -gt "0" ] 2>/dev/null; then
              echo "| Status | ⚠️ SECRETS DETECTED — Rotate immediately |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Status | ✅ No secrets detected |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secret-scan
          path: gitleaks-report.json
          if-no-files-found: ignore

  # ============================================================
  # JOB 4: Dependency Scanning — npm audit + Trivy
  # ============================================================
  dependency-scan:
    name: 📦 Dependency Scan — npm audit + Trivy
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.is_node == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "Tharunika(PDD)/package.json" ]; then
            cd "Tharunika(PDD)" && npm ci --prefer-offline || npm install
          elif [ -f "package.json" ]; then
            npm ci --prefer-offline || npm install
          fi

      - name: Run npm audit
        run: |
          TARGET_DIR="."
          if [ -f "Tharunika(PDD)/package.json" ]; then
            TARGET_DIR="Tharunika(PDD)"
          fi
          cd "$TARGET_DIR"
          npm audit --json > npm-audit-report.json 2>&1 || true

          # Parse and summarize
          CRITICAL=$(cat npm-audit-report.json | python3 -c "import json,sys; d=json.load(sys.stdin); v=d.get('metadata',{}).get('vulnerabilities',{}); print(v.get('critical',0))" 2>/dev/null || echo "0")
          HIGH=$(cat npm-audit-report.json | python3 -c "import json,sys; d=json.load(sys.stdin); v=d.get('metadata',{}).get('vulnerabilities',{}); print(v.get('high',0))" 2>/dev/null || echo "0")
          MODERATE=$(cat npm-audit-report.json | python3 -c "import json,sys; d=json.load(sys.stdin); v=d.get('metadata',{}).get('vulnerabilities',{}); print(v.get('moderate',0))" 2>/dev/null || echo "0")
          LOW=$(cat npm-audit-report.json | python3 -c "import json,sys; d=json.load(sys.stdin); v=d.get('metadata',{}).get('vulnerabilities',{}); print(v.get('low',0))" 2>/dev/null || echo "0")

          echo "## 📦 npm Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Dependency Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-reports
          path: |
            **/npm-audit-report.json
            trivy-fs-report.json
          if-no-files-found: ignore

  # ============================================================
  # JOB 5: API Security Checks (DAST)
  # ============================================================
  api-security:
    name: 🌐 API Security — DAST Checks
    runs-on: ubuntu-latest
    needs: detect-stack
    if: github.event.inputs.run_dast == 'true' && github.event.inputs.environment_url != ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: ${{ github.event.inputs.environment_url }}
          format: json
          fail_action: false
        continue-on-error: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: report_json.json
          if-no-files-found: ignore

  # ============================================================
  # JOB 6: Generate Final Security Report
  # ============================================================
  generate-report:
    name: 📊 Generate Security Report
    runs-on: ubuntu-latest
    needs: [detect-stack, sast-semgrep, secret-scan, dependency-scan]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-results
        continue-on-error: true

      - name: Install Report Dependencies
        run: |
          if [ -f "Vulnerability Test Results/package.json" ]; then
            cd "Vulnerability Test Results" && npm install
          else
            npm install exceljs
          fi
        continue-on-error: true

      - name: Generate Security Report
        run: |
          if [ -f "Vulnerability Test Results/generate-security-report.js" ]; then
            node "Vulnerability Test Results/generate-security-report.js" || true
          fi

          # Generate Markdown Summary
          cat > security-assessment-summary.md << 'EOF'
          # Security Assessment Summary — Unidwell Platform

          **Generated:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Framework:** Vite + React 19 + TypeScript SPA
          **Architecture:** Client-Side Only (No Backend API Server)

          ## Findings Summary

          | Severity | Count |
          |---|---|
          | 🔴 Critical | 3 |
          | 🟠 High | 5 |
          | 🟡 Medium | 5 |
          | 🟢 Low | 2 |
          | **Total** | **15** |

          ## Overall Security Score: 28/100

          ## Top Critical Risks
          1. Plaintext passwords in localStorage (CVSS 9.8)
          2. Aadhaar + biometric PII in localStorage (CVSS 9.3)  
          3. Hardcoded EmailJS API credentials (CVSS 9.1)
          EOF

      - name: Publish GitHub Actions Step Summary
        run: |
          echo "# 🔒 Security Assessment Report — Unidwell Platform" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Framework:** Vite + React 19 + TypeScript SPA | **Date:** $(date -u +\"%Y-%m-%d\")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count | OWASP Category |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | 3 | A02, A07 Cryptographic Failures / Auth |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | 5 | A01, A06, A07 Access Control / Auth |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | 5 | A05, A07, A09 Misconfiguration / Logging |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | 2 | A02, A04 Crypto / Design |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Overall Security Score: **28 / 100**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚨 Top Critical Findings" >> $GITHUB_STEP_SUMMARY
          echo "1. **FINDING-001** — Plaintext passwords stored in localStorage (CVSS 9.8)" >> $GITHUB_STEP_SUMMARY
          echo "2. **FINDING-003** — Aadhaar + biometric PII in localStorage — DPDPA violation (CVSS 9.3)" >> $GITHUB_STEP_SUMMARY
          echo "3. **FINDING-002** — Hardcoded EmailJS API keys in source code (CVSS 9.1)" >> $GITHUB_STEP_SUMMARY
          echo "4. **FINDING-005** — Auto-registration auth bypass (CVSS 8.6)" >> $GITHUB_STEP_SUMMARY
          echo "5. **FINDING-004** — Client-side route guard bypass via localStorage (CVSS 8.1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Immediate Actions Required" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Rotate EmailJS credentials NOW (already exposed)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Move secrets to GitHub Secrets / environment variables" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Remove PII / Aadhaar data from localStorage persistence" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Implement server-side authentication with bcrypt hashing" >> $GITHUB_STEP_SUMMARY

      - name: Upload Final Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-reports
          path: |
            Vulnerability Test Results/*.xlsx
            Vulnerability Test Results/*.md
            security-assessment-summary.md
            scan-results/**
          if-no-files-found: ignore
          retention-days: 90

  # ============================================================
  # JOB 7: Enforcement Gate — Fail on Critical Findings
  # ============================================================
  security-gate:
    name: 🚧 Security Gate — Fail on Critical
    runs-on: ubuntu-latest
    needs: [sast-semgrep, secret-scan, dependency-scan, generate-report]
    if: always()
    steps:
      - name: Download Scan Results
        uses: actions/download-artifact@v4
        with:
          path: scan-results
        continue-on-error: true

      - name: Evaluate Critical Findings
        id: evaluate
        run: |
          CRITICAL_FOUND=false

          # Check for hardcoded secrets (pre-known from analysis)
          if [ -f "scan-results/gitleaks-secret-scan/gitleaks-report.json" ]; then
            COUNT=$(cat scan-results/gitleaks-secret-scan/gitleaks-report.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo "0")
            if [ "$COUNT" -gt "0" ]; then
              echo "❌ CRITICAL: $COUNT hardcoded secrets detected by Gitleaks!"
              CRITICAL_FOUND=true
            fi
          fi

          # Known critical finding from SAST analysis
          echo "⚠️  Known Critical Findings from Manual SAST:"
          echo "  - FINDING-001: Plaintext passwords in localStorage (CVSS 9.8)"
          echo "  - FINDING-002: Hardcoded EmailJS credentials (CVSS 9.1)"
          echo "  - FINDING-003: Aadhaar PII in localStorage (CVSS 9.3)"
          CRITICAL_FOUND=true

          echo "critical_found=$CRITICAL_FOUND" >> $GITHUB_OUTPUT

      - name: Fail Pipeline on Critical Findings
        if: steps.evaluate.outputs.critical_found == 'true'
        run: |
          echo "::error::🚨 SECURITY GATE FAILED — Critical vulnerabilities detected!"
          echo "::error::Review the Security Assessment Report for full details."
          echo "::error::Resolve all Critical findings before merging."
          exit 1
